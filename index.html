 $('tabs').innerHTML='<button class="btn s'+(tab==='sk'?' on':'')+'" data-t="sk">'+L.skins+'</button><button class="btn s'+(tab==='up'?' on':'')+'" data-t="up">'+L.ups+'</button>';
 var g='';if(tab==='sk'){SK.forEach(function(s){var ow=owned(s),eq=save.skin===s.id;var pr=ow?(eq?'✔ '+L.equipped:L.equip):s.ad?'▶':'◆ '+s.p;
  g+='<div class="card'+(selId===s.id?' sel':'')+'" data-i="'+s.id+'" style="border-color:'+(selId===s.id?'#fff':RARC[s.r])+'"><canvas width="160" height="90" data-p="'+s.id+'"></canvas><div class="nm" style="color:'+RARC[s.r]+'">'+s.n+'</div><div class="pr">'+pr+'</div></div>';});}
 else{for(var k in UPS){var lv=save.up[k],mx=lv>=UPS[k].max,c=upCost(k);g+='<div class="card" style="border-color:#4fc3ff;grid-column:span 2"><div class="nm" style="font-size:15px">'+L.upn[k]+'</div><div class="pr">'+L.lv+lv+'/'+UPS[k].max+'</div><button class="btn s" data-u="'+k+'"'+(mx||save.coins<c?' disabled':'')+'>'+(mx?L.max:'◆ '+c)+'</button></div>';}}
 $('grid').innerHTML=g;Array.prototype.forEach.call($('grid').querySelectorAll('canvas'),function(c){drawPrev(c,c.dataset.p,0);});infoUI();}
function drawPrev(c,id,t){var x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);var sk=skinOf(id||save.skin);var keep=ctx;ctx=x;var n=7,sz=h/6.5;

  if(ow)h+=eq?'<button class="btn s" disabled>✔ '+L.equipped+'</button>':'<button class="btn" id="bEq">'+L.equip+'</button>';
  else if(s.ad)h+=adsAvail()?'<button class="btn g ad" id="bAdU">'+L.watch+'</button>':'<span>'+L.locked+'</span>';
  else h+='<button class="btn" id="bBuy"'+(save.coins<s.p?' disabled':'')+'>'+L.buy+' ◆ '+s.p+'</button>';}}
 $('info').innerHTML=h;var e;if(e=$('bEq'))e.onclick=function(){save.skin=s.id;persist();sUi();shopUI();};
 if(e=$('bBuy'))e.onclick=function(){if(save.coins>=s.p){save.coins-=s.p;save.owned[s.id]=1;save.skin=s.id;persist();sChain(2);shopUI();}};

$('tabs').addEventListener('click',function(e){var t=e.target.dataset.t;if(t){tab=t;selId=null;sUi();shopUI();}});
$('grid').addEventListener('click',function(e){var u=e.target.dataset.u;if(u){var c=upCost(u);if(save.coins>=c&&save.up[u]<UPS[u].max){save.coins-=c;save.up[u]++;persist();sChain(1);shopUI();}return;}var c2=e.target.closest('.card');if(c2&&c2.dataset.i){selId=c2.dataset.i;sUi();shopUI();}});

// ---------- input: follow-pointer / drag-anywhere ----------
var inp={a:0,boost:false,touch:false,on:false,sx:0,sy:0,lastTap:0,mb:false,kb:false,keys:{}};
function setDir(dx,dy){if(dx*dx+dy*dy>36)inp.a=Math.atan2(dy,dx);}
cv.addEventListener('pointerdown',function(e){audioUnlock();if(e.pointerType==='mouse'){inp.mb=true;inp.boost=true;return;}
 inp.touch=true;document.body.classList.add('touch');var now=performance.now();if(now-inp.lastTap<300)inp.boost=true;inp.lastTap=now;inp.on=true;inp.sx=e.clientX;inp.sy=e.clientY;inp.pid=e.pointerId;});
window.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'){setDir(e.clientX-W/2,e.clientY-H/2);return;}
 if(!inp.on||e.pointerId!==inp.pid)return;var dx=e.clientX-inp.sx,dy=e.clientY-inp.sy,d=Math.hypot(dx,dy);setDir(dx,dy);
 if(d>70){inp.sx=e.clientX-dx/d*70;inp.sy=e.clientY-dy/d*70;}});
function up(e){if(e.pointerType==='mouse'){inp.mb=false;inp.boost=inp.kb;return;}if(e.pointerId===inp.pid){inp.on=false;inp.boost=bb||inp.kb;}}
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
var bb=false;var BB=$('bBoost');BB.addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();bb=true;inp.boost=true;});BB.addEventListener('pointerup',function(){bb=false;inp.boost=false;});BB.addEventListener('pointerleave',function(){bb=false;if(!inp.mb)inp.boost=false;});
var KD={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]};
function keyDir(){var x=0,y=0;for(var k in inp.keys)if(inp.keys[k]&&KD[k]){x+=KD[k][0];y+=KD[k][1];}if(x||y)inp.a=Math.atan2(y,x);}
window.addEventListener('keydown',function(e){if(KD[e.code]){inp.keys[e.code]=1;keyDir();e.preventDefault();}if(e.code==='Space'){e.preventDefault();if(state==='menu'&&!$('menu').classList.contains('hide'))startRun();else{inp.kb=true;inp.boost=true;}}if(e.code==='Escape'||e.code==='KeyP')userPause(!paused.user);});
window.addEventListener('keyup',function(e){if(KD[e.code]){inp.keys[e.code]=0;keyDir();}if(e.code==='Space'){inp.kb=false;inp.boost=inp.mb||bb;}});

var raf=0,last=0,frames=0,fpsS=[];

 update(dt);render(t);music();if(state==='shop'&&frames%2===0)drawPrev($('prev'),selId,t);frames++;raf=requestAnimationFrame(frame);}
